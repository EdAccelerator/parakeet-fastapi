name: Publish container image

# Publishes container images to GitHub Container Registry whenever code
# lands on `main` or a version tag is pushed. The published image is attached
# to this repo's Packages page as `ghcr.io/<owner>/<repo>`.
#
# Tagging rules (see docker/metadata-action below):
#   - push to main        ->  :main, :sha-<git-sha>, :latest
#   - push tag vX.Y.Z     ->  :vX.Y.Z, :X.Y, :X, :latest
#   - pull request        ->  :pr-<n>     (NOT pushed; build-only smoke test)
#   - manual dispatch     ->  :main, :latest
#
# The workflow builds `linux/amd64` only by default. To also build arm64,
# add `linux/arm64` to the `platforms:` input below. arm64 builds run under
# QEMU emulation on amd64 runners, which combined with the baked-in 670 MB
# model layer and a fresh onnxruntime install pushes total build time past
# the free-tier 6-hour job limit on many runs. Switch to a native arm64
# runner (e.g. `ubuntu-24.04-arm`) if you need multi-arch.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercase the repo name so `EdAccelerator/parakeet-fastapi` -> `edaccelerator/parakeet-fastapi`
  # (GHCR namespaces are lowercase).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      # Required so the attest-build-provenance action can request an
      # OIDC token from GitHub.
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        # The model layer is large; default GH runners have ~14GB free which
        # can be tight when caching multi-arch builds. Trim some defaults.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=parakeet-fastapi
            org.opencontainers.image.description=Stateless FastAPI wrapper around NVIDIA Parakeet TDT 0.6B v3 multilingual ASR (CPU/ONNX).
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest provenance for pushed image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
